name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .yaml file from the Files app with "Open with → OpuntiaPad"
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpuntiaPad version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Sample file, screenshots, logs
      description: Do not share files containing secrets or personal data.
