name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests & debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the "dev" pre-release on pushes to main
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned, checks R8)
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opuntiapad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish development build (latest main)
        # Also on workflow_dispatch: the Dependabot auto-merge re-runs CI on main after merging.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/opuntiapad-debug.apk opuntiapad-dev.apk
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev opuntiapad-dev.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Automatic test build of the latest \`main\` (commit ${GITHUB_SHA::7}).

          - Installs **next to** the official app (package \`io.github.bbadis.opuntiapad.debug\`) and updates itself with each new dev build.
          - Not optimised and signed with a public debug key: use the versioned releases for everyday use."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Show failing instrumented tests
        if: failure()
        run: |
          # Print the failures in the log (artifacts are not always easy to open).
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{(failure.get('message') or '')[:300]}")
                      print((failure.text or '')[:3000])
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          retention-days: 14

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not available to Dependabot or fork pull requests: the job then skips itself.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN is not set: skipping SonarQube Cloud analysis (see docs/QUALITY.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0   # full history: needed for blame information and new-code detection

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.config.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.config.outputs.enabled == 'true'
        with:
          cache-read-only: true

      - name: Cache SonarQube packages
        if: steps.config.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Tests, coverage & lint
        if: steps.config.outputs.enabled == 'true'
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport lintDebug

      - name: SonarQube Cloud analysis
        if: steps.config.outputs.enabled == 'true'
        # --info makes the scanner print its own messages (errors such as a wrong key or token).
        run: ./gradlew sonar --info
