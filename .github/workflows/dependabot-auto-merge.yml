name: Dependabot auto-merge

# Merges Dependabot pull requests automatically once the whole CI (lint, unit tests, release build,
# emulator tests, Sonar) has passed on their latest commit. Minor and patch updates only: major updates
# get a label and a comment and wait for a human review. No code from the pull request is run here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write        # merge the pull request
  pull-requests: write   # label/comment major updates
  actions: write         # re-run CI on main after the merge

jobs:
  auto-merge:
    # Only same-repository Dependabot branches; the PR author is verified below through the API.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge minor and patch updates
        run: |
          OWNER=${REPO%%/*}
          PR_JSON=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$HEAD_BRANCH" --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then echo "No open pull request for $HEAD_BRANCH."; exit 0; fi
          NUMBER=$(jq -r .number <<<"$PR_JSON"); TITLE=$(jq -r .title <<<"$PR_JSON")
          AUTHOR_ID=$(jq -r .user.id <<<"$PR_JSON"); PR_SHA=$(jq -r .head.sha <<<"$PR_JSON")
          # 49699333 = dependabot[bot]; ids can't be spoofed like names in event payloads.
          if [ "$AUTHOR_ID" != "49699333" ]; then echo "PR #$NUMBER is not from Dependabot."; exit 0; fi
          if [ "$PR_SHA" != "$HEAD_SHA" ]; then echo "PR #$NUMBER has newer commits than this CI run; waiting."; exit 0; fi

          # "Bump foo from 1.2.3 to 2.0.0": never auto-merge a new major version.
          # Grouped PRs only contain minor/patch updates (see .github/dependabot.yml); majors come one by one.
          if [[ "$TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
            if ! gh api "repos/$REPO/issues/$NUMBER/labels" --jq '.[].name' | grep -qx "major-update"; then
              gh label create major-update --repo "$REPO" --color B60205 --description "Major dependency update: needs review" 2>/dev/null || true
              gh pr edit "$NUMBER" --repo "$REPO" --add-label major-update
              gh pr comment "$NUMBER" --repo "$REPO" --body "CI passed, but this is a **major** version update (${BASH_REMATCH[1]} → ${BASH_REMATCH[2]}): not merged automatically. Please review the changelog and merge manually."
            fi
            exit 0
          fi

          echo "Merging #$NUMBER: $TITLE"
          gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          # Merges made with GITHUB_TOKEN don't trigger 'push' workflows: run CI on main explicitly
          # (it also refreshes the "Development build" pre-release).
          gh workflow run ci.yml --repo "$REPO" --ref main
